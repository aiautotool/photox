name: Wire V4 ledger and web bridge
on:
  push:
    branches: [v4]
    paths:
      - '.github/workflows/v4-ledger-bridge-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('packages/persistence-sqlite/src/index.ts')
          text=p.read_text()
          marker="export * from './migration';"
          if marker not in text:
              p.write_text(text.rstrip()+"\n\n"+marker+"\n")

          app=Path('desktop/src/App.tsx')
          text=app.read_text()
          if "from './bridge'" not in text:
              text=text.replace("import exifr from 'exifr';\n", "import exifr from 'exifr';\nimport { resolveDesktopBridge, type BackupHealthSnapshot, type CloudState, type CloudUpload, type DesktopStatus, type DriveAccount, type LocalMedia, type TunnelState } from './bridge';\n")
              pattern=r"type LocalMedia = .*?declare global \{ interface Window \{ photoSyncDesktop\?:DesktopBridge \} \}\n"
              replacement="type MediaMetadata = {make?:string;model?:string;lens?:string;software?:string;focalLength?:number;focalLength35mm?:number;aperture?:number;exposureTime?:number;iso?:number;flash?:string;latitude?:number;longitude?:number;capturedAt?:Date};\n"
              text,n=re.subn(pattern,replacement,text,flags=re.S)
              if n!=1:
                  raise SystemExit(f'App bridge type block replacement count={n}')
              text=text.replace("export function App(){\n", "export function App(){\n  const bridge=useMemo(()=>resolveDesktopBridge(),[]);\n",1)
              text=text.replace('window.photoSyncDesktop','bridge')
              app.write_text(text)

          docs=Path('docs/V4_STORAGE_MIGRATION_WEB.md')
          text=docs.read_text()
          text=text.replace('- [ ] Add migration ledger + resumable state in SQLite.','- [x] Add migration ledger + resumable state in SQLite.')
          text=text.replace('- [ ] Extract the renderer bridge contract from `App.tsx`.','- [x] Extract the renderer bridge contract from `App.tsx`.')
          text=text.replace('- [ ] Keep Electron IPC adapter.','- [x] Keep Electron IPC adapter.')
          text=text.replace('- [ ] Add authenticated HTTP/WebSocket adapter.','- [x] Add authenticated HTTP/WebSocket adapter contract/client; server endpoints and auth enforcement remain pending.')
          docs.write_text(text)
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Full validation
        run: |
          npm install --ignore-scripts
          npm test
          npm run typecheck
          npm run build
      - name: Commit clean integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/v4-ledger-bridge-integrate.yml
          if [ -f .github/workflows/v4-migration-ledger.yml ]; then git rm -f .github/workflows/v4-migration-ledger.yml; fi
          git add packages/persistence-sqlite/src/index.ts desktop/src/App.tsx docs/V4_STORAGE_MIGRATION_WEB.md package-lock.json
          git commit -m "integrate durable migration ledger and shared web bridge"
          git pull --rebase origin v4
          git push origin HEAD:v4
