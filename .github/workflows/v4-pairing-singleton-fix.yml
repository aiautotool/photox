name: V4 pairing singleton fix
on:
  push:
    branches: [v4]
    paths:
      - '.github/workflows/v4-pairing-singleton-fix.yml'
      - '.github/scripts/v4_pairing_singleton_fix.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/v4_pairing_singleton_fix.py
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/pairingChallenge.ts desktop/electron/main.ts desktop/electron/internetTunnel.ts
          git commit -m "share workspace pairing challenge across desktop transports"
          git push origin v4
