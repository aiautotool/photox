name: V4 runtime writer migration

on:
  push:
    branches: [v4]
    paths:
      - .github/workflows/v4-runtime-writer-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch main runtime writers and add regression gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('desktop/electron/main.ts')
          text = main_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { driveRuntimeAllocation, rendererDriveAccountInfo, type DriveRuntimeAllocation, type RendererDriveAccountInfo } from './driveRuntimeAllocation.js';\n",
              "import { driveRuntimeAllocation, rendererDriveAccountInfo, type DriveRuntimeAllocation, type RendererDriveAccountInfo } from './driveRuntimeAllocation.js';\nimport { createMediaIndexRuntimeWriter } from './mediaIndexRuntimeWriter.js';\n",
              'runtime writer import',
          )

          replace_once(
              "function indexFile(){ return path.join(stateDir(),'media-index.json'); }\n",
              "function indexFile(){ return path.join(stateDir(),'media-index.json'); }\nfunction mediaIndexWriter(){ return createMediaIndexRuntimeWriter<MediaIndexRow>(indexFile()); }\n",
              'runtime writer factory',
          )

          old_video = """async function processVideoRow(key:string,workspaceId=LEGACY_WORKSPACE_ID){
            const row=(await readIndex(workspaceId)).find(item=>item.key===key);if(!row||!isVideoFilename(row.filename))return;
            await updateIndexRow(key,{videoProcessing:'processing',videoError:undefined},workspaceId);
            try{
              const processed=await processVideoFile(row.path,row.key,videoCacheDir());
              await updateIndexRow(key,{...processed,mediaType:'video',mimeType:row.mimeType||mimeTypeForFilename(row.filename),videoProcessing:'ready',videoError:undefined},workspaceId);
              notifyRenderer('photosync:media-processed',{key,...processed});
            }catch(error){
              const message=error instanceof Error?error.message:String(error);
              await updateIndexRow(key,{videoProcessing:'error',videoError:message},workspaceId);
              console.error('Video processing failed',row.filename,error);
            }
          }
          """
          new_video = """async function processVideoRow(key:string,workspaceId=LEGACY_WORKSPACE_ID){
            const row=(await readIndex(workspaceId)).find(item=>item.key===key);if(!row||!isVideoFilename(row.filename))return;
            const writer=mediaIndexWriter();
            await writer.patchVideo(workspaceId,key,{videoProcessing:'processing',videoError:undefined});
            try{
              const processed=await processVideoFile(row.path,row.key,videoCacheDir());
              await writer.patchVideo(workspaceId,key,{...processed,mediaType:'video',mimeType:row.mimeType||mimeTypeForFilename(row.filename),videoProcessing:'ready',videoError:undefined});
              notifyRenderer('photosync:media-processed',{key,...processed});
            }catch(error){
              const message=error instanceof Error?error.message:String(error);
              await writer.patchVideo(workspaceId,key,{videoProcessing:'error',videoError:message});
              console.error('Video processing failed',row.filename,error);
            }
          }
          """
          replace_once(old_video, new_video, 'video writer')

          old_replicas = "async function persistReplicas(row:MediaIndexRow,replicas:CloudDestination[]){row.cloudReplicas=replicas;row.cloud=replicas[0];const all=await readIndex(row.workspaceId);const i=all.findIndex(x=>x.key===row.key);if(i>=0){all[i]={...all[i],workspaceId:row.workspaceId,cloud:row.cloud,cloudReplicas:replicas};await writeIndex(all,row.workspaceId)}notifyRenderer('photosync:storage-updated',{workspaceId:row.workspaceId,key:row.key,cloudReplicas:replicas})}\n"
          new_replicas = "async function persistReplicas(row:MediaIndexRow,replicas:CloudDestination[]){const updated=await mediaIndexWriter().syncReplicas(row.workspaceId,row.key,replicas);const authoritative=updated?.cloudReplicas as CloudDestination[]|undefined;if(authoritative){row.cloudReplicas=authoritative;row.cloud=authoritative[0]}notifyRenderer('photosync:storage-updated',{workspaceId:row.workspaceId,key:row.key,cloudReplicas:authoritative||replicas})}\n"
          replace_once(old_replicas, new_replicas, 'replica writer')

          old_ingest = "await fs.rename(tmp,target); const row:MediaIndexRow={workspaceId:requestWorkspace,key,assetId,deviceId,filename,path:target,size:stat.size,createdAt,receivedAt:new Date().toISOString(),sha256:hash,mimeType,mediaType:declaredMediaType,videoProcessing:declaredMediaType==='video'?'queued':undefined,cloudReplicas:[]}; rows.push(row); await writeIndex(rows,requestWorkspace);"
          new_ingest = "await fs.rename(tmp,target); const row:MediaIndexRow={workspaceId:requestWorkspace,key,assetId,deviceId,filename,path:target,size:stat.size,createdAt,receivedAt:new Date().toISOString(),sha256:hash,mimeType,mediaType:declaredMediaType,videoProcessing:declaredMediaType==='video'?'queued':undefined,cloudReplicas:[]}; try{await mediaIndexWriter().ingest(row)}catch(error){if(error instanceof Error&&error.message==='MEDIA_INDEX_DUPLICATE_KEY'){repo.releaseMediaReservation(requestWorkspace,declaredSize);lastStatus.duplicates+=1;res.writeHead(208,{'content-type':'application/json'});res.end(JSON.stringify({state:'ALREADY_RECEIVED'}));return}throw error}"
          replace_once(old_ingest, new_ingest, 'ingest writer')

          main_path.write_text(text)

          test_path = Path('desktop/electron/mediaIndexRuntimeWiring.test.ts')
          test_path.write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          test('desktop main routes ingest, video, and replica writes through exact runtime writer', async () => {
            const source = await fs.readFile(path.resolve('electron/main.ts'), 'utf8');
            assert.match(source, /createMediaIndexRuntimeWriter<MediaIndexRow>\(indexFile\(\)\)/);
            assert.match(source, /mediaIndexWriter\(\)\.ingest\(row\)/);
            assert.match(source, /writer\.patchVideo\(workspaceId,key,/);
            assert.match(source, /mediaIndexWriter\(\)\.syncReplicas\(row\.workspaceId,row\.key,replicas\)/);
            assert.doesNotMatch(source, /rows\.push\(row\);\s*await writeIndex\(rows,requestWorkspace\)/);
            assert.doesNotMatch(source, /await updateIndexRow\(key,\{videoProcessing:/);
          });
          """)

          tsconfig_path = Path('desktop/tsconfig.electron-test.json')
          tsconfig = tsconfig_path.read_text()
          needle = '    "electron/mediaIndexRuntimeWriter.test.ts",\n'
          addition = needle + '    "electron/mediaIndexRuntimeWiring.test.ts",\n'
          if tsconfig.count(needle) != 1:
              raise SystemExit('test gate insertion point changed')
          tsconfig_path.write_text(tsconfig.replace(needle, addition, 1))
          PY
      - run: npm install
      - name: Run repository tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit migrated runtime writers
        shell: bash
        run: |
          git config user.name "aiautotool"
          git config user.email "161418348+aiautotool@users.noreply.github.com"
          git add desktop/electron/main.ts desktop/electron/mediaIndexRuntimeWiring.test.ts desktop/tsconfig.electron-test.json
          git commit -m "fix(v4): wire runtime media index writers"
          git push origin HEAD:v4
