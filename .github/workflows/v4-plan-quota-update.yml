name: Apply V4 quota plan update
on:
  push:
    branches: [v4]
    paths:
      - '.github/scripts/v4_plan_quota_update.py'
      - '.github/workflows/v4-plan-quota-update.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/v4_plan_quota_update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/V4_SAAS_PLAN.md
          git diff --cached --quiet || git commit -m "update v4 SaaS quota implementation plan"
          git push origin HEAD:v4
