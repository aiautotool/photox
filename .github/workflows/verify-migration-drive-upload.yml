name: Verify migration Drive upload
on:
  push:
    paths:
      - '.github/trigger-verify-migration-drive-upload'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/verify-migration-drive-upload.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts
          git commit -m "verify Google Drive migration upload size" || exit 0
          git push origin v4
