name: Apply V4 workspace quota patch
on:
  push:
    branches: [v4]
    paths:
      - '.github/scripts/v4_workspace_quota_patch.py'
      - '.github/workflows/v4-workspace-quota-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/v4_workspace_quota_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence-sqlite/src/workspace.ts packages/persistence-sqlite/src/workspace.test.ts mobile/src/sync/mobileSync.ts desktop/electron/main.ts
          git diff --cached --quiet || git commit -m "wire workspace quota enforcement into media ingest"
          git push origin HEAD:v4
