name: Fix Web Range Header
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/fix-web-range-header.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: v4 }
      - run: python .github/scripts/fix-web-range-header.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts
          git diff --cached --quiet || git commit -m "fix web media range request headers"
          git push origin HEAD:v4
