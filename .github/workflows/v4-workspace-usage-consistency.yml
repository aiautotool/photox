name: Apply V4 workspace usage consistency
on:
  push:
    branches: [v4]
    paths:
      - '.github/scripts/v4_workspace_usage_consistency.py'
      - '.github/workflows/v4-workspace-usage-consistency.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/v4_workspace_usage_consistency.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts
          git diff --cached --quiet || git commit -m "keep workspace usage and audit consistent"
          git push origin HEAD:v4
