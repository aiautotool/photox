name: One-shot wire ingest coordinator
on:
  push:
    branches: [v4]
    paths:
      - 'scripts/one-shot-wire-ingest-coordinator.mjs'
      - '.github/workflows/one-shot-wire-ingest-coordinator.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply ingest wiring
        run: node scripts/one-shot-wire-ingest-coordinator.mjs
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit production wiring and remove one-shot files
        shell: bash
        run: |
          git config user.name 'aiautotool'
          git config user.email '161418348+aiautotool@users.noreply.github.com'
          git rm scripts/one-shot-wire-ingest-coordinator.mjs .github/workflows/one-shot-wire-ingest-coordinator.yml
          git add desktop/electron/main.ts
          git diff --cached --check
          git commit -m 'fix(v4): serialize ingest file placement with catalog commit'
          git push origin HEAD:v4
