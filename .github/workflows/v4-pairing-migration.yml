name: V4 pairing migration
on:
  push:
    branches: [v4]
    paths:
      - '.github/workflows/v4-pairing-migration.yml'
      - '.github/scripts/v4_pairing_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/v4_pairing_patch.py
      - name: Fix backward-safe monthly usage fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/persistence-sqlite/src/workspace.ts')
          s=p.read_text()
          old="""    if(row?.monthly_ingress_period===period) return this.getUsage(workspaceId);\n    const usage=this.getUsage(workspaceId); const next={...usage,monthlyIngressBytes:0}; this.setUsage(workspaceId,next,now);\n    this.store.db.prepare('UPDATE photox_workspace_usage SET monthly_ingress_period=? WHERE workspace_id=?').run(period,workspaceId); return next;"""
          new="""    if(row?.monthly_ingress_period===period) return this.getUsage(workspaceId);\n    const usage=this.getUsage(workspaceId);\n    if(!row?.monthly_ingress_period){ this.store.db.prepare('UPDATE photox_workspace_usage SET monthly_ingress_period=? WHERE workspace_id=?').run(period,workspaceId); return usage; }\n    const next={...usage,monthlyIngressBytes:0}; this.setUsage(workspaceId,next,now);\n    this.store.db.prepare('UPDATE photox_workspace_usage SET monthly_ingress_period=? WHERE workspace_id=?').run(period,workspaceId); return next;"""
          if old not in s: raise SystemExit('monthly period pattern missing')
          s=s.replace(old,new,1)
          s=s.replace("reserveMediaWrite(workspaceId: string, bytes: number, limits: { maxManagedStorageBytes: number | null; maxMonthlyIngressBytes: number | null }): WorkspaceUsage {", "reserveMediaWrite(workspaceId: string, bytes: number, limits: { maxManagedStorageBytes: number | null; maxMonthlyIngressBytes: number | null }, now = Date.now()): WorkspaceUsage {")
          s=s.replace("const usage = this.ensureMonthlyIngressPeriod(workspaceId);", "const usage = this.ensureMonthlyIngressPeriod(workspaceId, now);",1)
          p.write_text(s)

          p=Path('packages/persistence-sqlite/src/workspace.test.ts')
          s=p.read_text()
          old="""  it('resets monthly ingress at UTC month boundary without reducing managed storage', () => {\n    const repo = new SqliteWorkspaceRepository(store);\n    repo.ensureLegacyPersonalWorkspace({ workspaceId:'month-ws', ownerUserId:'owner', now:Date.UTC(2026,7,20) });\n    repo.reserveMediaWrite('month-ws', 100, { maxManagedStorageBytes:null, maxMonthlyIngressBytes:1000 });\n    const before=repo.getUsage('month-ws'); expect(before.managedStorageBytes).toBe(100); expect(before.monthlyIngressBytes).toBe(100);\n    const after=repo.ensureMonthlyIngressPeriod('month-ws', Date.UTC(2026,8,1));\n    expect(after.managedStorageBytes).toBe(100); expect(after.monthlyIngressBytes).toBe(0);\n  });"""
          new="""  it('resets monthly ingress at UTC month boundary without reducing managed storage', () => {\n    const {store,repo}=setup();\n    const august=Date.UTC(2026,7,20);\n    repo.ensureLegacyPersonalWorkspace({ workspaceId:'month-ws', ownerUserId:'owner', now:august });\n    repo.ensureMonthlyIngressPeriod('month-ws', august);\n    repo.reserveMediaWrite('month-ws', 100, { maxManagedStorageBytes:null, maxMonthlyIngressBytes:1000 }, august);\n    const before=repo.getUsage('month-ws'); expect(before.managedStorageBytes).toBe(100); expect(before.monthlyIngressBytes).toBe(100);\n    const after=repo.ensureMonthlyIngressPeriod('month-ws', Date.UTC(2026,8,1));\n    expect(after.managedStorageBytes).toBe(100); expect(after.monthlyIngressBytes).toBe(0);\n    store.close();\n  });"""
          if old not in s: raise SystemExit('monthly test pattern missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/pairingChallenge.ts desktop/electron/tunnelClient.ts desktop/electron/internetTunnel.ts desktop/electron/main.ts relay/src/server.ts mobile/src/sync/pairing.ts mobile/src/sync/mobileSync.ts packages/persistence-sqlite/src/workspace.ts packages/persistence-sqlite/src/workspace.test.ts
          git commit -m "add workspace-aware pairing v2 and monthly quota rollover"
          git push origin v4
