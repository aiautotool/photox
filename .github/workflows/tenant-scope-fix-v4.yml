name: V4 tenant scope fix
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/tenant-scope-fix-v4.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: v4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fix replica/provider workspace scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop/electron/main.ts')
          s=p.read_text()
          old="async function persistReplicas(row:MediaIndexRow,replicas:CloudDestination[]){row.cloudReplicas=replicas;row.cloud=replicas[0];const all=await readIndex();const i=all.findIndex(x=>x.key===row.key);if(i>=0){all[i]={...all[i],cloud:row.cloud,cloudReplicas:replicas};await writeIndex(all)}notifyRenderer('photosync:storage-updated',{key:row.key,cloudReplicas:replicas})}"
          new="async function persistReplicas(row:MediaIndexRow,replicas:CloudDestination[]){row.cloudReplicas=replicas;row.cloud=replicas[0];const all=await readIndex(row.workspaceId);const i=all.findIndex(x=>x.key===row.key);if(i>=0){all[i]={...all[i],workspaceId:row.workspaceId,cloud:row.cloud,cloudReplicas:replicas};await writeIndex(all,row.workspaceId)}notifyRenderer('photosync:storage-updated',{workspaceId:row.workspaceId,key:row.key,cloudReplicas:replicas})}"
          if old not in s: raise SystemExit('persistReplicas anchor missing')
          s=s.replace(old,new)
          old2="for(const file of files)try{const saved:SavedDriveAccount=JSON.parse(await fs.readFile(path.join(driveAccountsDir(),file),'utf8'));if(saved.id===account.id)await fs.unlink(path.join(driveAccountsDir(),file))}catch{}"
          new2="for(const file of files)try{const saved:SavedDriveAccount=JSON.parse(await fs.readFile(path.join(driveAccountsDir(),file),'utf8'));if(saved.id===account.id&&(saved.workspaceId||LEGACY_WORKSPACE_ID)===LEGACY_WORKSPACE_ID)await fs.unlink(path.join(driveAccountsDir(),file))}catch{}"
          if old2 not in s: raise SystemExit('remove provider anchor missing')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/tenant-scope-fix-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts .github/workflows/tenant-scope-fix-v4.yml
          git commit -m "fix tenant-scoped replica and provider mutations"
          git push origin HEAD:v4
