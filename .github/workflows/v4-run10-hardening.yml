name: V4 Run10 Hardening

on:
  push:
    branches:
      - v4
    paths:
      - .github/workflows/v4-run10-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/v4-run10.py
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v4-run10-hardening.yml .github/scripts/v4-run10.py
          git add packages/google-photos/src/migration.ts packages/google-photos/src/index.test.ts desktop/electron/googlePhotosMigration.ts desktop/electron/webEdgeServer.ts desktop/electron/main.ts docs/V4_STORAGE_MIGRATION_WEB.md package-lock.json
          git commit -m "audit Web mutations and harden migration tenant isolation"
          git push origin HEAD:v4
