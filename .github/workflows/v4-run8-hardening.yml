name: V4 Run8 Hardening
on:
  push:
    branches: [v4]
    paths:
      - .github/workflows/v4-run8-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/v4-run8.py
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified changes
        run: |
          rm .github/v4-run8.py .github/workflows/v4-run8-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden web refresh cookies and scope Google Photos accounts"
          git push origin HEAD:v4
