name: V4 restart recovery wire
on:
  push:
    branches: [v4]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - name: Patch Desktop restart recovery wiring
        shell: python
        run: |
          from pathlib import Path
          p=Path('desktop/electron/main.ts')
          s=p.read_text()
          if "./mediaStartupRecovery.js" in s:
              print('already wired')
              raise SystemExit(0)
          replacements=[
            ("import { createMediaIngestCommitCoordinator } from './mediaIngestCommitCoordinator.js';", "import { createMediaIngestCommitCoordinator } from './mediaIngestCommitCoordinator.js';\nimport { createMediaIngestRecoveryJournal, recoverDeletionTombstones } from './mediaStartupRecovery.js';"),
            ("  cloudReplicas?:CloudDestination[];\n};", "  cloudReplicas?:CloudDestination[];\n  deletion?:{state:'deleting';claimId:string;startedAt:string};\n};"),
            ("function incomingDir(){ return path.join(stateDir(),'incoming'); }", "function incomingDir(){ return path.join(stateDir(),'incoming'); }\nfunction ingestRecoveryDir(){ return path.join(stateDir(),'ingest-recovery'); }\nfunction ingestRecoveryJournal(){return createMediaIngestRecoveryJournal({journalDir:ingestRecoveryDir(),libraryRoot:libraryDir(),incomingRoot:incomingDir()});}"),
            ("          const target=path.join(folder,`${parsed.name}-${uniqueSuffix}${parsed.ext}`);\n          await fs.rename(tmp,target);\n          const row:MediaIndexRow={workspaceId:requestWorkspace,key,assetId,deviceId,filename,path:target,size:stat.size,createdAt,receivedAt:new Date().toISOString(),sha256:hash,mimeType,mediaType:declaredMediaType,videoProcessing:declaredMediaType==='video'?'queued':undefined,cloudReplicas:[]};\n          try{await mediaIndexWriter().ingest(row);return {row,target};}\n          catch(error){await fs.unlink(target).catch(()=>undefined);throw error;}", "          const target=path.join(folder,`${parsed.name}-${uniqueSuffix}${parsed.ext}`);\n          const journal=ingestRecoveryJournal();\n          const recovery=await journal.begin({workspaceId:requestWorkspace,key,tmpPath:tmp,targetPath:target});\n          try{\n            await fs.rename(tmp,target);\n            const row:MediaIndexRow={workspaceId:requestWorkspace,key,assetId,deviceId,filename,path:target,size:stat.size,createdAt,receivedAt:new Date().toISOString(),sha256:hash,mimeType,mediaType:declaredMediaType,videoProcessing:declaredMediaType==='video'?'queued':undefined,cloudReplicas:[]};\n            await mediaIndexWriter().ingest(row);\n            await journal.complete(recovery.journalId);\n            return {row,target};\n          }catch(error){\n            await fs.unlink(target).catch(()=>undefined);\n            await journal.complete(recovery.journalId).catch(()=>undefined);\n            throw error;\n          }"),
            ("app.whenReady().then(async()=>{await fs.mkdir(libraryDir(),{recursive:true});await fs.mkdir(videoCacheDir(),{recursive:true});await fs.mkdir(googlePhotosAccountsDir(),{recursive:true});migrationStore=new SqlitePhotoXStore({path:migrationDbFile()});workspaceRepository=new SqliteWorkspaceRepository(migrationStore);await bootstrapLegacyWorkspace();", "app.whenReady().then(async()=>{await fs.mkdir(libraryDir(),{recursive:true});await fs.mkdir(incomingDir(),{recursive:true});await fs.mkdir(ingestRecoveryDir(),{recursive:true});await fs.mkdir(videoCacheDir(),{recursive:true});await fs.mkdir(googlePhotosAccountsDir(),{recursive:true});const ingestRecovery=await ingestRecoveryJournal().recover(await readAllIndex());if(ingestRecovery.scanned||ingestRecovery.invalid.length)console.info('PhotoX ingest restart recovery',ingestRecovery);migrationStore=new SqlitePhotoXStore({path:migrationDbFile()});workspaceRepository=new SqliteWorkspaceRepository(migrationStore);await bootstrapLegacyWorkspace();"),
            ("  });createWindow();const rows=await readIndex();for(const row of rows.filter(r=>isVideoFilename(r.filename)&&r.videoProcessing!=='ready'))void processVideoRow(row.key);", "  });createWindow();const deleteRecovery=await recoverDeletionTombstones(await readAllIndex(),row=>deleteManagedMedia(row.key,row.workspaceId));if(deleteRecovery.attempted)console.info('PhotoX deletion restart recovery',deleteRecovery);const rows=await readIndex();for(const row of rows.filter(r=>isVideoFilename(r.filename)&&r.videoProcessing!=='ready'))void processVideoRow(row.key);")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('expected patch anchor missing: '+old[:120])
              s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/electron/main.ts
          git commit -m "fix(v4): recover crash-left media operations on startup"
          git push origin HEAD:v4
