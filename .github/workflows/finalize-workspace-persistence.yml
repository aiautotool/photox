name: Finalize Workspace Persistence
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/finalize-workspace-persistence.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: v4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python .github/scripts/finalize-workspace-persistence.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence-sqlite/src/index.ts packages/persistence-sqlite/src/workspace.ts package-lock.json
          git diff --cached --quiet || git commit -m "fix workspace sqlite transaction"
          git push origin HEAD:v4
# rerun-after-transaction-fix
