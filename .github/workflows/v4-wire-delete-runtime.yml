name: V4 wire delete runtime
on:
  push:
    branches: [v4]
    paths:
      - scripts/v4_wire_delete_runtime.py
      - .github/workflows/v4-wire-delete-runtime.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire deletion lifecycle and provider gate
        run: python3 scripts/v4_wire_delete_runtime.py
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit runtime wiring
        run: |
          git config user.name 'aiautotool'
          git config user.email '161418348+aiautotool@users.noreply.github.com'
          git add desktop/electron/main.ts desktop/electron/mediaIndexRuntimeWiring.test.ts
          git commit -m 'fix(v4): serialize media delete with provider operations'
          git push origin HEAD:v4
