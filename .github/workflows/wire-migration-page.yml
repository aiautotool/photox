name: Wire migration page
on:
  push:
    paths:
      - '.github/trigger-wire-migration-page'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/wire-migration-page.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/App.tsx
          git commit -m "wire real migration page into shared desktop web UI" || exit 0
          git push origin v4
