name: Apply V4 workspace sessions
on:
  push:
    branches: [v4]
    paths:
      - '.github/workflows/apply-v4-session.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/v4_session_patch.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated session integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts mobile/src/sync/mobileSync.ts relay/src/server.ts package-lock.json
          git commit -m "integrate workspace access sessions end to end"
          git push origin v4
