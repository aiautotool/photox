name: V4 resumable migration patch
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/v4-resumable-patch.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover and run patch payload
        shell: bash
        run: |
          git show b9c899a5daea3da3bb6809b13de728d8fb40d6c0:.github/workflows/v4-resumable-patch.yml > /tmp/payload.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/payload.yml').read_text()
          start=text.index("          python3 <<'PY'\n")+len("          python3 <<'PY'\n")
          end=text.index("\n          PY\n      - run: npm install",start)
          out=[]; triple=None
          for line in text[start:end].splitlines():
              if triple:
                  out.append(line)
                  if triple in line: triple=None
                  continue
              normalized=line[10:] if line.startswith('          ') else line
              out.append(normalized)
              for token in ("'''", '\"\"\"'):
                  if token in normalized and normalized.count(token)%2==1:
                      triple=token; break
          Path('/tmp/patch.py').write_text('\n'.join(out)+'\n')
          PY
          python3 /tmp/patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/google-drive/src/index.test.ts'); s=p.read_text()
          s=s.replace("from './index';", "from './index.js';")
          s=s.replace("const request=vi.fn(async()=>new Response", "const request=vi.fn(async(_url:string,_init?:RequestInit)=>new Response")
          p.write_text(s)
          p=Path('packages/google-drive/src/index.ts'); s=p.read_text()
          s=s.replace('    body: input.bytes,', '    body: input.bytes as unknown as BodyInit,')
          p.write_text(s)
          p=Path('packages/persistence-sqlite/src/migration.ts'); s=p.read_text()
          s=s.replace("SET checkpoint_json=?,updated_at=COALESCE(updated_at,?) WHERE id=?", "SET checkpoint_json=?,updated_at=? WHERE id=?")
          p.write_text(s)
          PY
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated batch to v4 and remove patch workflow
        shell: bash
        run: |
          git config user.name 'PhotoX V4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v4-resumable-patch.yml
          git add packages/google-drive packages/google-photos packages/persistence-sqlite desktop/electron package.json package-lock.json
          git commit -m 'resume Google Drive migrations across restarts'
          git push origin HEAD:v4
