name: Wire timeline
on:
  push:
    branches: [v3]
    paths:
      - '.github/scripts/wire_timeline.py'
      - '.github/workflows/wire-timeline.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply timeline wiring
        run: python .github/scripts/wire_timeline.py
      - name: Verify
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/home/MobileHome.tsx
          git commit -m "virtualize main photo timeline by date"
          git push origin HEAD:v3
