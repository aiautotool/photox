name: Fix migration live progress
on:
  push:
    paths:
      - '.github/trigger-fix-migration-live-progress'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix-migration-live-progress.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts desktop/src/MigrationPage.tsx
          git commit -m "make migration progress live and controls responsive" || exit 0
          git push origin v4
