name: Wire Web Edge
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/wire-web-edge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: v4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python .github/scripts/wire-web-edge.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts
          git diff --cached --quiet || git commit -m "wire authenticated web edge server"
          git push origin HEAD:v4
# trigger
