name: CI
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log || {
            {
              echo '### npm test failure'
              echo '```text'
              tail -n 160 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test packaged Desktop renderer
        env:
          PHOTOX_DESKTOP_SMOKE: '1'
        run: xvfb-run -a npm --workspace @photosync/desktop run smoke:packaged-renderer
