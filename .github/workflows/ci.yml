name: CI
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log || {
            {
              echo '### npm test failure'
              echo '```text'
              tail -n 160 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test built Desktop renderer
        env:
          PHOTOX_DESKTOP_SMOKE: '1'
        run: xvfb-run -a npm --workspace @photosync/desktop run smoke:packaged-renderer
      - name: Package Desktop app directory
        working-directory: desktop
        run: npx electron-builder --linux dir --x64 --publish never
      - name: Smoke test electron-builder packaged Desktop app
        shell: bash
        env:
          PHOTOX_DESKTOP_SMOKE: '1'
        run: |
          set -euo pipefail
          APP="$(find desktop/release/linux-unpacked -maxdepth 1 -type f -perm -111 ! -name 'chrome-sandbox' ! -name 'chrome_crashpad_handler' | head -n 1)"
          test -n "$APP"
          echo "Packaged executable: $APP"
          xvfb-run -a "$APP" --no-sandbox
