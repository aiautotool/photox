name: PhotoX SDK CI
on:
  push:
    branches: [main, photox-sdk-v2]
    paths:
      - 'package.json'
      - 'packages/contracts/**'
      - 'packages/storage/**'
      - 'packages/sync/**'
      - 'packages/media/**'
      - 'packages/media-cloud/**'
      - 'packages/media-api/**'
      - 'packages/media-delivery/**'
      - 'packages/media-delivery-node/**'
      - 'packages/video-media/**'
      - 'packages/video-ffmpeg/**'
      - 'packages/persistence-sqlite/**'
      - 'packages/integrity/**'
      - 'packages/jobs/**'
      - 'packages/reconciliation/**'
      - 'packages/catalog-backup/**'
      - 'packages/replica-policy/**'
      - 'packages/image-editor/**'
      - 'packages/transport/**'
      - 'packages/update-core/**'
      - 'packages/provider-local/**'
      - 'packages/provider-google-drive/**'
      - 'packages/provider-telegram/**'
      - 'packages/desktop-sdk/**'
      - 'packages/mobile-sdk/**'
      - '.github/workflows/photox-sdk-ci.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'packages/**'
      - '.github/workflows/photox-sdk-ci.yml'

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build SDK in dependency order
        run: npm run build:sdk
      - name: Typecheck SDK in dependency order
        run: npm run typecheck:sdk
      - name: Test image editor
        run: npm --workspace @photox/image-editor test
