name: V4 tenant scope integration
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/tenant-scope-v4.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch desktop tenant scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('desktop/electron/main.ts')
          s=p.read_text()
          s=s.replace("import { chooseAccount, entitlementsForPlan, evaluateBackupHealth, DEFAULT_PHOTO_POLICY, DEFAULT_VIDEO_POLICY, type MediaReplica, type StorageAccount } from '@photosync/core';",
            "import { chooseAccount, entitlementsForPlan, evaluateBackupHealth, DEFAULT_PHOTO_POLICY, DEFAULT_VIDEO_POLICY, migrateLegacyWorkspaceRows, replaceWorkspaceRows, rowsForWorkspace, type MediaReplica, type StorageAccount } from '@photosync/core';")
          s=s.replace("type MediaIndexRow = {\n  key:string;", "type MediaIndexRow = {\n  workspaceId:string;\n  key:string;")
          s=s.replace("type SavedDriveAccount = { id:string; email?:string; tokens:any };", "type SavedDriveAccount = { id:string; workspaceId?:string; email?:string; tokens:any };")
          old="""async function readIndex():Promise<MediaIndexRow[]>{ try{return JSON.parse(await fs.readFile(indexFile(),'utf8'))}catch{return []} }
          async function writeIndex(rows:MediaIndexRow[]){ await fs.mkdir(stateDir(),{recursive:true}); await fs.writeFile(indexFile(),JSON.stringify(rows,null,2),'utf8'); }
          async function updateIndexRow(key:string,patch:Partial<MediaIndexRow>){const rows=await readIndex();const index=rows.findIndex(row=>row.key===key);if(index<0)return null;rows[index]={...rows[index],...patch};await writeIndex(rows);return rows[index]}"""
          new="""async function readAllIndex():Promise<MediaIndexRow[]>{
            try{
              const raw=JSON.parse(await fs.readFile(indexFile(),'utf8')) as Omit<MediaIndexRow,'workspaceId'>[]|MediaIndexRow[];
              const migrated=migrateLegacyWorkspaceRows(raw as MediaIndexRow[],LEGACY_WORKSPACE_ID);
              if(migrated.migrated){await fs.mkdir(stateDir(),{recursive:true});await fs.writeFile(indexFile(),JSON.stringify(migrated.rows,null,2),'utf8');}
              return migrated.rows;
            }catch{return []}
          }
          async function readIndex(workspaceId=LEGACY_WORKSPACE_ID):Promise<MediaIndexRow[]>{return rowsForWorkspace(await readAllIndex(),workspaceId)}
          async function writeIndex(rows:MediaIndexRow[],workspaceId=LEGACY_WORKSPACE_ID){
            const normalized=rows.map(row=>({...row,workspaceId}));
            const all=await readAllIndex();const merged=replaceWorkspaceRows(all,workspaceId,normalized);
            await fs.mkdir(stateDir(),{recursive:true});await fs.writeFile(indexFile(),JSON.stringify(merged,null,2),'utf8');
          }
          async function updateIndexRow(key:string,patch:Partial<MediaIndexRow>,workspaceId=LEGACY_WORKSPACE_ID){const rows=await readIndex(workspaceId);const index=rows.findIndex(row=>row.key===key);if(index<0)return null;rows[index]={...rows[index],...patch,workspaceId};await writeIndex(rows,workspaceId);return rows[index]}"""
          if old not in s: raise SystemExit('index helpers anchor missing')
          s=s.replace(old,new)
          s=s.replace("async function processVideoRow(key:string){\n  const row=(await readIndex()).find(item=>item.key===key);", "async function processVideoRow(key:string,workspaceId=LEGACY_WORKSPACE_ID){\n  const row=(await readIndex(workspaceId)).find(item=>item.key===key);")
          s=s.replace("await updateIndexRow(key,{videoProcessing:'processing',videoError:undefined});", "await updateIndexRow(key,{videoProcessing:'processing',videoError:undefined},workspaceId);")
          s=s.replace("await updateIndexRow(key,{...processed,mediaType:'video',mimeType:row.mimeType||mimeTypeForFilename(row.filename),videoProcessing:'ready',videoError:undefined});", "await updateIndexRow(key,{...processed,mediaType:'video',mimeType:row.mimeType||mimeTypeForFilename(row.filename),videoProcessing:'ready',videoError:undefined},workspaceId);")
          s=s.replace("await updateIndexRow(key,{videoProcessing:'error',videoError:message});", "await updateIndexRow(key,{videoProcessing:'error',videoError:message},workspaceId);")
          s=s.replace("async function listLocalMedia():Promise<LocalMedia[]>{\n  const rows=await readIndex();", "async function listLocalMedia(workspaceId=LEGACY_WORKSPACE_ID):Promise<LocalMedia[]>{\n  const rows=await readIndex(workspaceId);")
          s=s.replace("async function deleteManagedMedia(key:string){\n  const rows=await readIndex();", "async function deleteManagedMedia(key:string,workspaceId=LEGACY_WORKSPACE_ID){\n  const rows=await readIndex(workspaceId);")
          s=s.replace("const accounts=new Map((await savedDriveAccounts()).map(account=>[account.id,account]));", "const accounts=new Map((await savedDriveAccounts(workspaceId)).map(account=>[account.id,account]));",1)
          s=s.replace("rows.splice(index,1);await writeIndex(rows);\n  const repo=requireWorkspaceRepository();repo.releaseMediaReservation(LEGACY_WORKSPACE_ID,row.size,{releaseManaged:true,releaseIngress:false});\n  repo.appendAudit({workspaceId:LEGACY_WORKSPACE_ID", "rows.splice(index,1);await writeIndex(rows,workspaceId);\n  const repo=requireWorkspaceRepository();repo.releaseMediaReservation(workspaceId,row.size,{releaseManaged:true,releaseIngress:false});\n  repo.appendAudit({workspaceId")
          s=s.replace("async function fetchCloudMedia(row:MediaIndexRow,request:Request):Promise<Response>{\n  const replicas=replicasOf(row).filter(replica=>isVerified(replica)&&replica.remoteFileId&&replica.accountId);\n  const accounts=new Map((await savedDriveAccounts()).map(account=>[account.id,account]));", "async function fetchCloudMedia(row:MediaIndexRow,request:Request):Promise<Response>{\n  const replicas=replicasOf(row).filter(replica=>isVerified(replica)&&replica.remoteFileId&&replica.accountId);\n  const accounts=new Map((await savedDriveAccounts(row.workspaceId)).map(account=>[account.id,account]));")
          pattern=r"async function savedDriveAccounts\(\):Promise<SavedDriveAccount\[]>\{.*?\n\}\n\nasync function connectGoogle"
          repl="""async function savedDriveAccounts(workspaceId=LEGACY_WORKSPACE_ID):Promise<SavedDriveAccount[]>{
            await fs.mkdir(driveAccountsDir(),{recursive:true});
            const files=(await fs.readdir(driveAccountsDir())).filter(x=>x.endsWith('.json'));
            const unique=new Map<string,SavedDriveAccount>();
            for(const file of files){try{
              const filePath=path.join(driveAccountsDir(),file);const raw:SavedDriveAccount=JSON.parse(await fs.readFile(filePath,'utf8'));
              const account:SavedDriveAccount=raw.workspaceId?raw:{...raw,workspaceId:LEGACY_WORKSPACE_ID};
              if(!raw.workspaceId)await fs.writeFile(filePath,JSON.stringify(account,null,2),'utf8');
              if(account.workspaceId!==workspaceId)continue;
              const identity=tokenIdentity(account.tokens); const email=(account.email||identity.email)?.toLowerCase();
              const key=identity.sub||email||account.id;
              unique.set(key,{...account,email:email||account.email});
            }catch{}}
            return [...unique.values()];
          }

          async function connectGoogle"""
          s2,n=re.subn(pattern,repl,s,flags=re.S)
          if n!=1: raise SystemExit(f'savedDriveAccounts replace count {n}')
          s=s2
          s=s.replace("if((tokenData.sub&&identity.sub===tokenData.sub)||(email&&(saved.email||identity.email)?.toLowerCase()===email))await fs.unlink", "if((saved.workspaceId||LEGACY_WORKSPACE_ID)===LEGACY_WORKSPACE_ID&&((tokenData.sub&&identity.sub===tokenData.sub)||(email&&(saved.email||identity.email)?.toLowerCase()===email)))await fs.unlink")
          s=s.replace("JSON.stringify({id,email:email||id,tokens},null,2)", "JSON.stringify({id,workspaceId:LEGACY_WORKSPACE_ID,email:email||id,tokens},null,2)")
          s=s.replace("JSON.stringify({id:account.id,tokens:client.credentials},null,2)", "JSON.stringify({...account,tokens:client.credentials},null,2)")
          s=s.replace("async function runtimeDriveAccounts():Promise<RuntimeDriveAccount[]>{\n  const saved=await savedDriveAccounts();", "async function runtimeDriveAccounts(workspaceId=LEGACY_WORKSPACE_ID):Promise<RuntimeDriveAccount[]>{\n  const saved=await savedDriveAccounts(workspaceId);")
          s=s.replace("async function listDriveAccounts():Promise<DriveAccountInfo[]>{\n  const saved=await savedDriveAccounts();\n  const runtime=new Map((await runtimeDriveAccounts()).map", "async function listDriveAccounts(workspaceId=LEGACY_WORKSPACE_ID):Promise<DriveAccountInfo[]>{\n  const saved=await savedDriveAccounts(workspaceId);\n  const runtime=new Map((await runtimeDriveAccounts(workspaceId)).map")
          s=s.replace("async function uploadLocalToDrive(row:MediaIndexRow){\n  const accounts=await runtimeDriveAccounts();", "async function uploadLocalToDrive(row:MediaIndexRow){\n  const accounts=await runtimeDriveAccounts(row.workspaceId);")
          # Receive: derive scope from bearer/challenge and keep all writes inside it.
          s=s.replace("const bearer=typeof req.headers.authorization==='string'&&req.headers.authorization.startsWith('Bearer ');\n  if(bearer){await requireWorkspaceAuth().authorizeRequest(req,['media:write']);}\n  else if(req.headers['x-photosync-pair-code']!==pair&&!workspacePairingChallenges.verify({challenge:String(req.headers['x-photosync-pairing-challenge']||''),workspaceId:String(req.headers['x-photosync-workspace-id']||'')})){res.writeHead(401);res.end('Invalid media credential');return;}",
          "const bearer=typeof req.headers.authorization==='string'&&req.headers.authorization.startsWith('Bearer ');\n  let requestWorkspace=LEGACY_WORKSPACE_ID;\n  if(bearer){const principal=await requireWorkspaceAuth().authorizeRequest(req,['media:write']);requestWorkspace=principal.workspaceId!;}\n  else {const headerWorkspace=String(req.headers['x-photosync-workspace-id']||'');if(req.headers['x-photosync-pair-code']!==pair&&!workspacePairingChallenges.verify({challenge:String(req.headers['x-photosync-pairing-challenge']||''),workspaceId:headerWorkspace})){res.writeHead(401);res.end('Invalid media credential');return;}if(headerWorkspace)requestWorkspace=headerWorkspace;}")
          s=s.replace("const rows=await readIndex(); if(rows.some(x=>x.key===key))", "const rows=await readIndex(requestWorkspace); if(rows.some(x=>x.key===key))",1)
          s=s.replace("const repo=requireWorkspaceRepository();const workspace=repo.getWorkspace(LEGACY_WORKSPACE_ID);", "const repo=requireWorkspaceRepository();const workspace=repo.getWorkspace(requestWorkspace);")
          s=s.replace("repo.reserveMediaWrite(LEGACY_WORKSPACE_ID,declaredSize", "repo.reserveMediaWrite(requestWorkspace,declaredSize")
          s=s.replace("const row:MediaIndexRow={key,assetId,deviceId,filename", "const row:MediaIndexRow={workspaceId:requestWorkspace,key,assetId,deviceId,filename")
          s=s.replace("rows.push(row); await writeIndex(rows);", "rows.push(row); await writeIndex(rows,requestWorkspace);")
          s=s.replace("repo.appendAudit({workspaceId:LEGACY_WORKSPACE_ID,actorUserId:LEGACY_OWNER_USER_ID,actorDeviceId:deviceId,action:'media.ingest'", "repo.appendAudit({workspaceId:requestWorkspace,actorUserId:LEGACY_OWNER_USER_ID,actorDeviceId:deviceId,action:'media.ingest'")
          s=s.replace("if(declaredMediaType==='video')void processVideoRow(key);void enqueueCloudUpload(row);", "if(declaredMediaType==='video')void processVideoRow(key,requestWorkspace);void enqueueCloudUpload(row);")
          s=s.replace("repo.releaseMediaReservation(LEGACY_WORKSPACE_ID,declaredSize);", "repo.releaseMediaReservation(requestWorkspace,declaredSize);")
          # Receiver: preserve authorized principal workspace, then scope all reads/deletes.
          s=s.replace("const bearer=typeof req.headers.authorization==='string'&&req.headers.authorization.startsWith('Bearer ');\n    if(bearer){const scope=", "const bearer=typeof req.headers.authorization==='string'&&req.headers.authorization.startsWith('Bearer ');\n    let authorizedWorkspace=LEGACY_WORKSPACE_ID;\n    if(bearer){const scope=")
          s=s.replace("try{await requireWorkspaceAuth().authorizeRequest(req,[scope]);}catch(error)", "try{const principal=await requireWorkspaceAuth().authorizeRequest(req,[scope]);authorizedWorkspace=principal.workspaceId!;}catch(error)")
          s=s.replace("else if(!legacyPairValid&&!workspaceChallengeValid){res.writeHead(401);res.end('Invalid or expired pairing credential');return;}", "else if(!legacyPairValid&&!workspaceChallengeValid){res.writeHead(401);res.end('Invalid or expired pairing credential');return;}else if(workspaceChallengeValid){authorizedWorkspace=requestWorkspace;}")
          # Restrict receiver endpoint operations. Limit replacements to exact endpoint snippets.
          s=s.replace("if(req.method==='GET'&&url.pathname==='/api/v1/status'){const index=await readIndex();", "if(req.method==='GET'&&url.pathname==='/api/v1/status'){const index=await readIndex(authorizedWorkspace);")
          s=s.replace("const items=await listLocalMedia();const rows=new Map((await readIndex()).map(row=>[row.key,row]));", "const items=await listLocalMedia(authorizedWorkspace);const rows=new Map((await readIndex(authorizedWorkspace)).map(row=>[row.key,row]));")
          s=s.replace("const key=decodeURIComponent(url.pathname.slice('/api/v1/thumbnail/'.length));const row=(await readIndex()).find", "const key=decodeURIComponent(url.pathname.slice('/api/v1/thumbnail/'.length));const row=(await readIndex(authorizedWorkspace)).find")
          s=s.replace("const key=decodeURIComponent(url.pathname.slice('/api/v1/playback/'.length));const row=(await readIndex()).find", "const key=decodeURIComponent(url.pathname.slice('/api/v1/playback/'.length));const row=(await readIndex(authorizedWorkspace)).find")
          s=s.replace("const key=decodeURIComponent(url.pathname.slice('/api/v1/media/'.length));try{const result=await deleteManagedMedia(key);", "const key=decodeURIComponent(url.pathname.slice('/api/v1/media/'.length));try{const result=await deleteManagedMedia(key,authorizedWorkspace);")
          s=s.replace("const key=decodeURIComponent(url.pathname.slice('/api/v1/media/'.length));const row=(await readIndex()).find", "const key=decodeURIComponent(url.pathname.slice('/api/v1/media/'.length));const row=(await readIndex(authorizedWorkspace)).find")
          p.write_text(s)
          PY
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit integration and remove temporary workflow
        run: |
          rm .github/workflows/tenant-scope-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/main.ts .github/workflows/tenant-scope-v4.yml
          git commit -m "scope desktop media and Drive providers by workspace"
          git push origin HEAD:v4
