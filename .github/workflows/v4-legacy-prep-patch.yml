name: V4 legacy media index preparation patch
on:
  push:
    branches: [v4]
    paths: ['.github/workflows/v4-legacy-prep-patch.yml']
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire crash-safe legacy preparation into Desktop startup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop/electron/main.ts')
          s=p.read_text()
          old="import { chooseAccount, entitlementsForPlan, evaluateBackupHealth, DEFAULT_PHOTO_POLICY, DEFAULT_VIDEO_POLICY, migrateLegacyWorkspaceRows, type MediaReplica, type StorageAccount } from '@photosync/core';"
          new="import { chooseAccount, entitlementsForPlan, evaluateBackupHealth, DEFAULT_PHOTO_POLICY, DEFAULT_VIDEO_POLICY, type MediaReplica, type StorageAccount } from '@photosync/core';"
          if old not in s: raise SystemExit('core import anchor missing')
          s=s.replace(old,new,1)
          anchor="import { mediaCatalogDiagnosticsForDesktopOperator, mediaCatalogDiagnosticsForWeb } from './mediaCatalogOperationsTransport.js';"
          if anchor not in s: raise SystemExit('helper import anchor missing')
          s=s.replace(anchor,anchor+"\nimport { prepareLegacyMediaIndexForSqlite } from './legacyMediaIndexPreparation.js';",1)
          old_fn="""async function prepareLegacyIndexForSqlite():Promise<void>{
            try{
              const raw=JSON.parse(await fs.readFile(indexFile(),'utf8')) as Omit<MediaIndexRow,'workspaceId'>[]|MediaIndexRow[];
              const migrated=migrateLegacyWorkspaceRows(raw as MediaIndexRow[],LEGACY_WORKSPACE_ID);
              if(!migrated.migrated)return;
              await fs.mkdir(stateDir(),{recursive:true});
              const tmp=`${indexFile()}.${crypto.randomUUID()}.migrating`;
              await fs.writeFile(tmp,`${JSON.stringify(migrated.rows,null,2)}\\n`,'utf8');
              await fs.rename(tmp,indexFile());
            }catch(error){
              if((error as NodeJS.ErrnoException).code==='ENOENT')return;
              throw error;
            }
          }"""
          new_fn="""async function prepareLegacyIndexForSqlite():Promise<void>{
            const result=await prepareLegacyMediaIndexForSqlite({indexPath:indexFile(),workspaceId:LEGACY_WORKSPACE_ID});
            if(result.removedStaleTemps)console.info('PhotoX removed stale legacy media-index migration temps',result.removedStaleTemps);
          }"""
          import textwrap
          old_fn=textwrap.dedent(old_fn)
          new_fn=textwrap.dedent(new_fn)
          if old_fn not in s: raise SystemExit('legacy preparation function anchor missing')
          p.write_text(s.replace(old_fn,new_fn,1))
          PY
          git diff --check
          grep -F "prepareLegacyMediaIndexForSqlite({indexPath:indexFile(),workspaceId:LEGACY_WORKSPACE_ID})" desktop/electron/main.ts
          ! grep -F "migrateLegacyWorkspaceRows" desktop/electron/main.ts
      - run: npm install
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Smoke test built Desktop renderer
        env:
          PHOTOX_DESKTOP_SMOKE: '1'
        run: xvfb-run -a npm --workspace @photosync/desktop run smoke:packaged-renderer
      - name: Package Desktop app directory
        working-directory: desktop
        run: npx electron-builder --linux dir --x64 --publish never
      - name: Smoke test packaged Desktop app
        env:
          PHOTOX_DESKTOP_SMOKE: '1'
        run: xvfb-run -a desktop/release/linux-unpacked/photosync --no-sandbox
      - name: Commit production wiring
        shell: bash
        run: |
          git config user.name 'aiautotool'
          git config user.email '161418348+aiautotool@users.noreply.github.com'
          git add desktop/electron/main.ts
          git commit -m 'feat(v4): use crash-safe legacy index preparation'
          git push origin HEAD:v4
