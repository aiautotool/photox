name: V4 Web Auth Integration
on:
  push:
    branches: [v4]
    paths:
      - '.github/workflows/v4-web-auth-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch desktop web auth wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop/electron/main.ts')
          s=p.read_text()
          old="async function streamWebMedia(req:IncomingMessage,res:ServerResponse,key:string,variant:'original'|'playback'|'thumbnail'){\n  const row=(await readIndex()).find(item=>item.key===key);"
          new="async function streamWebMedia(req:IncomingMessage,res:ServerResponse,key:string,variant:'original'|'playback'|'thumbnail',workspaceId:string){\n  const row=(await readIndex(workspaceId)).find(item=>item.key===key);"
          if old not in s: raise SystemExit('streamWebMedia anchor missing')
          s=s.replace(old,new,1)
          old2="  webEdgeServer=new PhotoXWebEdgeServer(config,{\n    getStatus:desktopStatus,"
          new2="  webEdgeServer=new PhotoXWebEdgeServer(config,{\n    authorizeAccessToken:async(token,required)=>{const principal=await requireWorkspaceAuth().authorizeToken(token,required);return {subject:principal.subject,workspaceId:principal.workspaceId!,workspaceRole:principal.workspaceRole,deviceId:principal.deviceId,sessionId:principal.sessionId,scopes:principal.scopes};},\n    refreshSession:refreshToken=>requireWorkspaceAuth().refresh(refreshToken),\n    revokeSession:sessionId=>requireWorkspaceAuth().revoke(sessionId),\n    getStatus:desktopStatus,"
          if old2 not in s: raise SystemExit('web edge handler anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/electron/main.ts
          if ! git diff --cached --quiet; then
            git commit -m 'wire web edge to workspace sessions'
            git push origin HEAD:v4
          fi
